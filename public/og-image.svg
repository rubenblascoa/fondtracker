<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#030303"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39ff88"/>
      <stop offset="100%" stop-color="#00df81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Ambient glowing orbs -->
  <circle cx="950" cy="150" r="220" fill="#39ff88" opacity="0.08" filter="url(#glow)"/>
  <circle cx="150" cy="500" r="180" fill="#39ff88" opacity="0.05" filter="url(#glow)"/>

  <!-- Top bar / Badge -->
  <rect x="80" y="80" width="340" height="38" rx="19" fill="#121216" stroke="#27272a" stroke-width="1"/>
  <circle cx="100" cy="99" r="6" fill="#39ff88"/>
  <text x="116" y="104" fill="#39ff88" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="1">INSTITUTIONAL FUND ANALYTICS</text>

  <!-- Main Headline -->
  <text x="80" y="180" fill="#ffffff" font-family="'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">FondTracker</text>
  <text x="80" y="240" fill="url(#neon)" font-family="'Inter', sans-serif" font-size="44" font-weight="800">El Terminal Definitivo para Fondos y ETFs</text>

  <!-- Subtitle -->
  <text x="80" y="300" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="22" font-weight="400">
    Sincronización en tiempo real de NAVs, reportes automáticos por WhatsApp
  </text>
  <text x="80" y="335" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="22" font-weight="400">
    y análisis institucional de carteras (TWR, XIRR, Look-Through &amp; TER).
  </text>

  <!-- Feature Cards Row -->
  <g transform="translate(80, 390)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="320" height="110" rx="12" fill="#121216" stroke="#27272a" stroke-width="1"/>
    <text x="24" y="38" fill="#39ff88" font-family="monospace" font-size="13" font-weight="bold">+490 FONDOS</text>
    <text x="24" y="68" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="bold">QueFondos &amp; Yahoo</text>
    <text x="24" y="90" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="13">Valor liquidativo actualizado</text>

    <!-- Card 2 -->
    <rect x="340" y="0" width="320" height="110" rx="12" fill="#121216" stroke="#27272a" stroke-width="1"/>
    <text x="364" y="38" fill="#39ff88" font-family="monospace" font-size="13" font-weight="bold">WHATSAPP DIGESTS</text>
    <text x="364" y="68" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="bold">Alertas &amp; Resúmenes</text>
    <text x="364" y="90" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="13">Directo a tu móvil cada día</text>

    <!-- Card 3 -->
    <rect x="680" y="0" width="340" height="110" rx="12" fill="#121216" stroke="#27272a" stroke-width="1"/>
    <text x="704" y="38" fill="#39ff88" font-family="monospace" font-size="13" font-weight="bold">PDF INSTITUCIONAL v4</text>
    <text x="704" y="68" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="bold">Auditoría de Cartera</text>
    <text x="704" y="90" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="13">Costes, concentración &amp; holdings</text>
  </g>

  <!-- Footer / Developer Credits connecting rubenblascoa.github.io -->
  <line x1="80" y1="550" x2="1120" y2="550" stroke="#27272a" stroke-width="1"/>
  <text x="80" y="585" fill="#6b7280" font-family="monospace" font-size="14">https://fondtracker.onrender.com • Open Source MIT</text>
  <text x="1120" y="585" text-anchor="end" fill="#39ff88" font-family="monospace" font-size="14" font-weight="bold">Desarrollado por Rubén Blasco Armengod | rubenblascoa.github.io</text>
</svg>
